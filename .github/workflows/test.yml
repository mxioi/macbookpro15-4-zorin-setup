# GitHub Actions workflow for testing scripts
# Note: This is a placeholder - actual testing requires T2 hardware

name: Syntax Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install ShellCheck
      run: sudo apt-get install -y shellcheck

    - name: Check shell scripts
      run: |
        shellcheck -x -S warning scripts/*.sh tests/*.sh

    - name: Self-test shared helpers
      run: bash tests/test_lib_os.sh

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Lint markdown files
      uses: DavidAnson/markdownlint-cli2-action@v9
      with:
        globs: '**/*.md'
